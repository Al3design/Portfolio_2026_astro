schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Astro + React + TinaCMS, MDX/Git como fuente editorial, SCSS con tokens semanticos.
  Produccion en Vercel: https://al3design.dev; www redirige al dominio raiz.
  Respetar AGENTS.md: rama activa, sin branches ni worktrees automaticos.
  No publicar, hacer push ni archivar cambios incompletos sin autorizacion.
  Identidad: Inter, Roboto Mono para metadata; verde CTA, naranja claves, cyan iconos.
  No agregar bordes de seccion; usar superficies, espacio y ghost-border permitido.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
