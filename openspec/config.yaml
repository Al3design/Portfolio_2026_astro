schema: spec-driven

context: |
  Language: es
  Rutina de IA local: .agents/skills/portfolio-editorial/SKILL.md y references/operacion.md; prompts y perfiles Windows propios del portfolio. No copiar ramas, colecciones, dominios, validadores ni carril Netlify de otros proyectos. Diseño fijo y cambios focales; funcionalidades nuevas son otro alcance.
  Altas/cambios conservan tokens y maqueta existentes, jerarquia, anchos, espacios, tipografias, variantes, temas y responsive. Sitio usa src/styles/abstracts y --clr-brand-*; admin --al3-admin-* y puente --tina-* aislados de sitio/iframe segun docs/TINA_ADMIN_THEME.md. No resolver contenido con estilos/HTML/clases nuevos ni modificar tokens sin encargo explicito. Tina distingue articulos ES/EN, paginas, globales, orden, fichas Shop y seleccion; formularios, apariencia y Cloud son capas distintas. Vercel usa vercel.json; ejemplos genericos de adapters/Netlify no autorizan cambiar infraestructura.
  Preview real requiere URL directa e identidad SHA o manifiesto mas deployment ID. Registrar ESPERANDO_OK_PREVIEW fuera de Git y terminar turno hasta OK posterior de Alejandro para esa revision, incluso si el encargo inicial pide publicar. Guardar en Cloud/main o push/merge productivo antes de ese OK esta prohibido. Si no hay acceso/carril Preview, reportar bloqueo sin inventar evidencia. Copia temporal explicita permitida como candidato, sin worktrees; comandos de scripts no autorizan controles por tanda. Cierre y produccion siguen AGENTS y flujo Git/Vercel confirmado, sin nuevos merges despues de publicar.
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Astro + React + TinaCMS, MDX/Git como fuente editorial, SCSS con tokens semanticos.
  Produccion en Vercel: https://al3design.dev; www redirige al dominio raiz.
  Decision de Alejandro 13/11/2026: encargo nuevo crea codex/<tarea> desde main limpia y actualizada por fetch/fast-forward; encargo retomado sigue su rama existente. No ramas por tanda ni worktrees. Ante cambios ajenos/divergencia coordinar, sin reset/clean/stash automaticos. Tras OK posterior del Preview integrar por flujo permitido y dejar main local/remota actualizada y limpia, sin pedir nuevamente permiso por la misma revision. Esto reemplaza la prohibicion anterior de crear ramas por encargo; no autoriza produccion antes del OK.
  No publicar, hacer push ni archivar cambios incompletos sin autorizacion.
  Para alta/edicion editorial, leer primero docs/GUIA_EDITORIAL_IA.md y usar docs/templates como borradores.
  Respetar contratos Tina/renderer ES/EN, imagenes, metadatos y RSS; no crear plantillas visuales paralelas.
  Shop requiere seleccion publica explicita en src/editorial/shop-catalogue/catalogue.json; formulario tina/shop-catalogue.ts e imports derivados scripts/lib/shop-catalogue-plugin.mjs. Guardar un borrador no publica.
  Para nuevas piezas usar docs/templates/pieza-shop.json; articulos docs/templates/articulo-bilingue.mdx. Actualizar plantilla y docs/GUIA_EDITORIAL_IA.md cuando cambie un campo, sin copiar contenido real a las plantillas.
  Campo nuevo = esquema Tina + contrato/validacion + proyeccion ES/EN + renderer + consumidores/listados/social/RSS/preview aplicables. No editar tina/__generated__ manualmente.
  Guardado desde dashboards Tina: releer _values completo, modificar solo el campo solicitado, transformar mediante schema.transformPayload y usar TinaAdminApi.updateDocument autenticado, como el formulario nativo. Las mutaciones no son patches parciales; no enviar solo order/categoryOrders porque puede reemplazar el documento y perder contenido. Rechazar lecturas incompletas y verificar preservacion/restauracion antes de aprobar el flujo.
  Home publica: reservar separacion respecto del topbar fijo mediante layout(nav-height) y tokens de espacio en el modulo home, sin modificar el layout global por una sola pagina. En mobile, ocultar mission y status/location/timezone por CSS bajo md (48em), conservando datos/esquema Tina y controles de filtros/layout/exportacion.
  Home mobile: si Filtrar ya muestra el total, no repetir ese total en el resumen. Cambios de orden por drag deben conservar IDs fuera de filtros/paginacion, permitir alternativa de teclado y guardar explicitamente. Efectos decorativos touch deben conservar scroll/zoom nativos y atender pointercancel/reduced-motion; no bloquear gestos del body para sostener una animacion.
  Sistema visual Tina documentado en docs/TINA_ADMIN_THEME.md. CSS vendor aislado public/admin-theme/admin.css, tokens --al3-admin-*, instalador src/lib/admin-theme.ts desde cmsCallback de tina/config.ts. Nunca cargarlo en sitio publico ni iframe.
  Mantener tamanos/estados de iconos, foco, avisos y handlers nativos. Actualizar cache-version del instalador al cambiar CSS. No parchear node_modules ni usar filtros globales para oscurecer.
  Campos personalizados Tina: contrastar FieldWrapper/FieldsGroup vendor; dentro de flex declarar ancho completo, min-inline-size cero y white-space normal cuando corresponda, sin ampliar todos los formularios para ocultar un problema local. Adaptar filas mediante contenedor nombrado al ancho real del campo, con titulo flexible, acciones accesibles y targets de 44px; iconos compactos no implican area pulsable menor. Estetica de listas Portfolio/Shop comparte tokens y Save/Reset nativos; cambios visuales no alteran seleccion ni guardado.
  Listas editoriales Portfolio/Shop deben compartir EditorialOrderList y tokens --al3-admin-list-* (densidad, tipografia, miniatura, controles y paginador), sin igualar sus contratos: Portfolio ordena articulos visibles por ambito; Shop selecciona/reemplaza/retira referencias. Paginar solo la vista (10/20/50), conservar el array completo y otros ambitos; validar permutaciones de pagina antes de fusionarlas. Dar movimientos a posicion global y entre paginas, no limitar el orden al subconjunto visible. Save/Reset nativos; sin mutaciones autonomas ni guardado al abrir/paginar. Restaurar el documento previo al cancelar drag, incluyendo migracion aun no guardada. Contratos y plantillas no se cambian por una mejora visual.
  Listas de seleccion/orden en formularios Tina usan un unico scroll, el FormWrapper nativo. No agregar max-height/overflow auto al listado; si hay autoscroll de drag, debe desplazar ese mismo ancestro, no un contenedor interno invisible ni body. Conservar Save/Reset nativos y comprobar scroll, teclado y drag tras el cambio.
  Revisar estados checked/focus de menus del editor ademas del toolbar: pueden heredar colores vendor distintos. Usar tokens acotados a roles/estados, sin cambiar seleccion o contenido para corregir contraste. Si aparece Unsaved changes al abrir sin editar, no guardar/resetear para resolver una auditoria; registrar y diagnosticar antes de persistir.
  Directivas permanentes y registro continuo:
  Este config contiene reglas reutilizables del proyecto, independientes del nombre de la rama o de una sesion. AGENTS.md es el punto de entrada para agentes; las guias tematicas detallan procedimientos. No depender de un handoff fechado para conocer una rutina obligatoria.
  Cada cambio o rutina nueva debe actualizar aqui su directiva duradera cuando corresponda, en la guia tematica sus pasos y fuentes, y en docs/CHANGELOG.md el cambio significativo. README enlaza las fuentes; plantillas se actualizan si cambia el contrato editorial.
  Fechas de ejecucion, commits, Preview URLs, autorizaciones consumidas, resultados y bloqueos van en reportes/tasks del cambio OpenSpec o handoff, no como reglas permanentes de este config. Consultarlos antes de repetir acciones, sin confundir evidencia con autorizacion.
  Al retomar comprobar rama, HEAD, indice y diff; las instrucciones versionadas deben estar incorporadas a la rama del encargo para estar disponibles alli. No copiar sobre trabajo ajeno ni fusionar automaticamente solo para propagar instrucciones; aplicar el flujo Git vigente de AGENTS al iniciar/cerrar un encargo.
  Si cambia una rutina, actualizar su fuente canonica y las referencias afectadas; evitar duplicar instrucciones completas con estados contradictorios. Conservar evidencia historica identificada como tal.
  Rutinas de Tina y Cloud:
  Menus globales: src/content/global/navigation.mdx contiene portfolioMenu/shopMenu ordenables ES/EN, separados de footer.mdx compartido por ambos sitios. Plantillas en tina/global-settings.ts, schema Astro en src/content.config.ts, validacion/proyeccion en src/lib/site-navigation.ts; MainLayout lee frontmatter raw y Navigation recibe datos serializables para desktop/movil. Claves unicas estables, collection reservada para adaptacion de destino Shop, etiquetas y enlaces validos; un link no crea pagina ni traduccion. No duplicar footer ni importar configuracion Tina en React publico. Conservar anchors, foco y aria-current.
  Versiones vigentes se leen de package.json y lock; actualizar CMS/CLI de forma compatible y revisar overrides. No reinstalar por un indice remoto viejo ni editar generados a mano. No aflojar cloud checks.
  Este repo usa pnpm-lock.yaml y pin de tinacms en pnpm-workspace.yaml: actualizar ese override conjuntamente con CMS/CLI, sin introducir package-lock.json ni usar latest sin contrastar versiones/engines/peers. Si dev esta activo, coordinar parada/reinicio para actualizar paquetes; no matar procesos ajenos. El aviso de version del sidebar es informativo y no instala. La regeneracion de tina-lock y controles/publicacion siguen la politica y alcance autorizados.
  Revisar peers y engines desde manifests/enlaces activos y lock, no por carpetas antiguas del almacen pnpm. Distinguir contrato declarado de funcionamiento observado. Un peer transitivo incompatible se registra con impacto y alcance pendiente; no forzar majors, bajar React ni silenciar avisos automaticamente para cerrar una actualizacion.
  Ante diferencia GraphQL local/remota, confirmar proyecto, rama del cliente desplegado y eventos del indice. Reindexar solo la rama autorizada cuando corresponda; registrar resultado antes de reconstruir con el permiso aplicable. No tocar main, webhooks u otras ramas por rutina.
  Site URLs, indice de rama, credenciales y plantilla visual son configuraciones distintas. Para habilitar editor verificar el origen exacto, conservar entradas/protecciones y usar la autorizacion aplicable; no agregar comodines ni nuevos origenes por cada deployment automaticamente. No leer/exportar secretos.
  Antes de guardar en Cloud confirmar proyecto/rama y cambios ajenos. Un control reversible autorizado lee el valor original actual, cambia solo el campo acordado, guarda/reabre, restaura/guarda/reabre y registra commits y limites. No reutilizar una autorizacion consumida ni pedir de nuevo una vigente para la misma accion.
  Guardar puede generar commits y builds automaticos; no sumar builds manuales ni extender esa evidencia a produccion. Si Cloud avanzo, inspeccionar commits/diff antes de sincronizar el checkout sucio; nunca pull/reset ciego.
  Live Preview requiere router, consulta, suscripcion y renderer conectado en el entorno correspondiente. Comprobar su alcance en codigo; un origen habilitado o build verde no acredita preview remoto, upload nuevo ni persistencia.
  El listado Tina puede entregar solo _sys. No interpretar titulo ausente como draft: resolveProjectEditorRoute comprueba la pagina desplegada por HEAD del mismo origen antes de abrir visual en Cloud. Conservar formulario nativo ante ausencia, proteccion, redireccion, error o timeout; revision de drafts sigue local. Un cambio de router necesita publicar el bundle admin, no reindexar por rutina.
  Upload desde Tina debe comprobarse mediante su gestor de medios, con foto autorizada, carpeta/ruta aceptada, alt ES/EN y reapertura. Una copia por filesystem o API interna no acredita el selector UI. Si filechooser falla, registrar y revisar soporte de archivos de la extension sin modificar permisos automaticamente ni repetir controles fallidos.
  No atribuir un timeout de filechooser a permisos sin evidencia; si el usuario informa que habilito archivos y persiste, registrar limite de automatizacion. Una carga manual asistida no equivale a selector automatizado aprobado. Antes de iniciar dev contrastar puertos con la sesion previa y el servidor visible para evitar duplicarlo.
  Para controles locales reversibles usar ficha y carpeta temporales identificables; conservar seleccion original, restaurarla antes de retirar referencias/medios y verificar ausencia de restos propios. Nunca borrar originales o cambios ajenos. Reutilizar servidor existente; el arranque y limpieza requieren el alcance autorizado correspondiente.
  Guardar contenido ya publico en Tina Cloud/main puede generar commit y deploy; respetar autorizacion antes de guardar.
  Documentar por separado preparado, verificado, Preview y produccion; no inventar datos ni ampliar autorizaciones.
  Orden editorial: el singleton src/editorial/project-order/order.json, coleccion projectOrder en tina/project-order.ts, guarda listas de referencias por all/categoria. Unico editor en Portfolio · orden visual del menu: ProjectVisualOrderField en tina/dashboard/ProjectVisualOrderEditor.tsx carga inventario por cursor y conecta input.value/onChange al formulario nativo. Save/Reset y aviso de cambios pertenecen a Tina, igual que Store 3D · seleccion publica; no agregar segundo editor, redireccion o mutacion propia en Overview. Overview solo consulta/filtra inventario. Con scopes vacio mantener order/categoryOrders; primer movimiento prepara prioridades desde el inventario de la sesion, solo Save las persiste. Con listas activas, articulos nuevos al final y categorias sin lista heredan all. Preservar otros ambitos y referencias fuera del subconjunto, sin reescribir articulos. src/lib/project-visual-order.ts valida/proyecta y project-order.ts compara antes de destacado/paginacion. Orden no cambia publicacion ni cronologia Resume/RSS. El formulario nativo no ofrece compare-and-swap: coordinar editores y recargar si hubo cambios externos antes de guardar. No sembrar listas al abrir ni afirmar persistencia por tipos verdes. Estetica con tokens admin y lista continua; teclado/touch disponibles ademas del drag.
  Para validadores de listas de objetos en Tina, comprobar la forma del valor recibido si la inferencia vendor es ambigua. Usar unknown y guards de estructura; conservar mensajes de validacion y evitar casts para ocultar errores de contrato.
  Identidad: Inter, Roboto Mono para metadata; verde CTA, naranja claves, cyan iconos.
  No agregar bordes de seccion; usar superficies, espacio y ghost-border permitido.
  Politica de roles y verificacion de AGENTS.md y docs/TESTING_MCP.md (decision de Alejandro, 2026-10-16).
  Causa GitCron: suites repetidas agotaban tiempo/contexto; MCP duplicados saturaban RAM;
  capturas duplicadas y prompts contradictorios generaban ciclos sin salida. No reintroducirlos.
  Ejecutora sin verificacion, build, pruebas, tipos, lint, e2e ni captura/inspeccion de pantallas por tanda.
  Solo ejecutar el comando de control expresamente pedido por el prompt, una vez.
  Si falla, reportar comando y fallo y entregar, sin reintentar ni correr controles alternativos.
  Orquestador audita cada tanda leyendo diff y reporte, sin ejecutar verificaciones; toma las capturas de auditoria.
  Al completar todas las tareas del cambio, el orquestador corre la verificacion final antes de archivar o fusionar y resuelve los fallos.
  No aprobar cierre con fallos pendientes ni repetir suites completas por cada arreglo acotado.
  No aflojar protecciones, esconder errores, desactivar lint, saltear pruebas ni cambiar producto para pasar controles.
  Los prompts y skills respetan reglas y controles; las excepciones deben nombrarse en el prompt y reportarse, sin bucles ni desactivar protecciones.
  No iniciar MCP por rutina ni reactivar el servidor global e2e sin consultar a Alejandro.
  e2e por consola en el cierre o por comando explicito, usando e2e.config.ts; no duplicar Tina.

rules:
  proposal:
    - Identificar fuentes de verdad y guias afectadas; separar comportamiento solicitado de acciones remotas que requieren autorizacion.
  design:
    - Para campos editoriales mapear esquema Tina, contrato, proyeccion ES/EN, renderer, medios, listados, metadatos, RSS y preview aplicables.
    - Para apariencia Tina usar el adaptador y tokens existentes; documentar limites vendor y conservar acciones, foco, avisos y temas del iframe.
  tasks:
    - Incluir actualizacion de directivas permanentes en config y guias cuando cambie una rutina, y de plantillas cuando cambie un contrato.
    - Registrar resultado real, evidencia, permisos consumidos y pendientes por separado; no cerrar tareas por reportes heredados o controles de otro alcance.
    - Respetar la politica de ejecucion de AGENTS; una tarea de verificacion no autoriza correrla por cada tanda.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
